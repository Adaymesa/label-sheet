<!--
  Tab icon: a barcode on the app's dispatch teal.

  Laid out on a 16-unit grid because that is the size it is actually seen at, so every
  bar edge lands on a whole pixel and the bars stay crisp instead of blurring into a
  grey smudge. Bar widths vary the way a real symbol does; it reads as a barcode rather
  than as a picket fence.

  Note: no double hyphen anywhere in this comment. XML forbids it, and an invalid file
  here still builds fine, because the build strips comments before inlining.

  A solid tile rather than bars on transparency, so it holds up against both a light and
  a dark browser chrome.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <rect width="16" height="16" rx="3.5" fill="#0f5c4e" />
  <g fill="#fbfaf7">
    <rect x="3" y="4" width="1" height="8" />
    <rect x="5" y="4" width="2" height="8" />
    <rect x="8" y="4" width="1" height="8" />
    <rect x="10" y="4" width="1" height="8" />
    <rect x="12" y="4" width="1" height="8" />
  </g>
</svg>
